# Full local stack with one command: Supabase (docker-compose.supabase.yml) plus the migration, the
# API, the worker, WhatsApp and the backoffice. Always used together with the Supabase file:
#
#   pnpm stack:up      # generates the secrets if missing, builds the image and brings everything up
#   pnpm stack:down    # stops (volumes are kept); `pnpm stack:reset` deletes them
#   pnpm stack:logs    # follows the logs of the API, the worker and WhatsApp
#
# Equivalent to: docker compose -f docker-compose.supabase.yml -f docker-compose.stack.yml
#               --env-file infra/supabase/.env up -d --build --wait
#
# A single project (`gow-supabase`, the other file's name): existing Supabase volumes are reused.
# Everything listens on 127.0.0.1 only: backoffice 5173, API 3000, Studio 54342, Auth mail
# (Inbucket) 54343. Change them with GOW_WEB_PORT and GOW_API_PORT.
#
# One image (`gow-credit-app`) to migrate, run the API, the worker and WhatsApp: `APP` changes. The
# code runs with tsx, as in development. Role passwords are the dev ones from
# infra/postgres/init/00-roles.sql; none of this is meant for anything but a local machine.

x-app: &app
  image: gow-credit-app:local
  pull_policy: never
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

x-roles: &roles
  DATABASE_URL_API: postgres://gow_api:gow_api_dev@db:5432/postgres
  DATABASE_URL_WORKER: postgres://gow_worker:gow_worker_dev@db:5432/postgres
  DATABASE_URL_WHATSAPP: postgres://gow_whatsapp:gow_whatsapp_dev@db:5432/postgres
  DATABASE_URL_READONLY: postgres://gow_readonly:gow_readonly_dev@db:5432/postgres
  DATABASE_URL_QUEUE: postgres://gow_queue:gow_queue_dev@db:5432/postgres
  DATABASE_URL_MASTRA: postgres://gow_mastra:gow_mastra_dev@db:5432/postgres

services:
  # Sign-in link email. Inbucket by default; `scripts/stack.sh` sets GOW_SMTP_* to Resend's SMTP
  # when RESEND_API_KEY is in the root .env.
  auth:
    environment:
      GOTRUE_SMTP_HOST: ${GOW_SMTP_HOST:-mail}
      GOTRUE_SMTP_PORT: ${GOW_SMTP_PORT:-2500}
      GOTRUE_SMTP_USER: ${GOW_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOW_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOW_SMTP_ADMIN_EMAIL:-${SMTP_ADMIN_EMAIL}}
      GOTRUE_SMTP_SENDER_NAME: ${GOW_SMTP_SENDER_NAME:-${SMTP_SENDER_NAME}}

  # Applies the migrations as the `postgres` role and exits. Everything else waits for it to finish OK.
  migrate:
    <<: *app
    build:
      context: .
      target: runtime
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["./node_modules/.bin/tsx", "packages/db/src/cli/migrate.ts"]
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres

  api:
    <<: *app
    ports:
      - "127.0.0.1:${GOW_API_PORT:-3000}:3000"
    volumes:
      - gow-storage:/data/storage
    environment:
      <<: *roles
      APP: api
      HOST: 0.0.0.0
      PORT: "3000"
      API_PUBLIC_URL: http://127.0.0.1:${GOW_API_PORT:-3000}
      BACKOFFICE_URL: http://127.0.0.1:${GOW_WEB_PORT:-5173}
      BACKOFFICE_JWT_SECRET: ${JWT_SECRET}
      STORAGE_SIGNING_SECRET: ${GOW_STORAGE_SIGNING_SECRET}
      STORAGE_DIR: /data/storage
      # Supabase Auth over the internal network: the backoffice signs in with an email link.
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Model keys come from the root .env (optional): without it only what is cached runs
  # (LLM_CACHE_MODE=read) and a new document fails instead of spending.
  worker:
    <<: *app
    env_file:
      - path: .env
        required: false
    volumes:
      - gow-storage:/data/storage
      - gow-llm-cache:/data/llm-cache
    environment:
      <<: *roles
      APP: worker
      API_PUBLIC_URL: http://127.0.0.1:${GOW_API_PORT:-3000}
      STORAGE_SIGNING_SECRET: ${GOW_STORAGE_SIGNING_SECRET}
      STORAGE_DIR: /data/storage
      LLM_CACHE_DIR: /data/llm-cache

  # No WHATSAPP_TENANT_ID: it discovers the only tenant and waits for the wizard to create it. The
  # number is linked by scanning the QR in the backoffice. The Baileys session lives in a volume.
  whatsapp:
    <<: *app
    volumes:
      - gow-whatsapp:/data/whatsapp
    environment:
      DATABASE_URL_WHATSAPP: postgres://gow_whatsapp:gow_whatsapp_dev@db:5432/postgres
      APP: whatsapp
      WHATSAPP_AUTH_DIR: /data/whatsapp

  web:
    image: gow-credit-web:local
    pull_policy: never
    restart: unless-stopped
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GOW_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gow-storage:
  gow-llm-cache:
  gow-whatsapp:
