packages:
  - apps/*
  - packages/*
  - spikes
  - evals
  - scenarios

# Cadena de suministro: no instalar versiones publicadas hace menos de 3 días.
minimumReleaseAge: 4320

# Versiones parchadas de dependencias transitivas de herramientas de desarrollo (osv-scanner en CI).
# Los paquetes que las traen (evalite 0.19, drizzle-kit 0.31, eslint 10) ya están en su última
# versión y todavía piden las vulnerables. Se quitan cuando ellos suban.
overrides:
  '@fastify/static': ^10.1.2 # GHSA-83w8-p2f5-377r, GHSA-8pvw-jcv7-9cmj, GHSA-pr96-94w5-mx2h, GHSA-x428-ghpx-8j92 (evalite)
  '@fastify/static>glob': ^14.0.2 # GHSA-3g3m-2fjr-6pw4
  file-type: ^21.3.1 # GHSA-5v7r-6r5c-r473 (evalite)
  minimatch@>=7 <11.0.1: ^11.0.1 # GHSA-g3hv-75wg-m249 (eslint)
  '@esbuild-kit/core-utils>esbuild': ^0.25.0 # GHSA-67mh-4wv8-2f99 (drizzle-kit)

# Solo estos paquetes pueden correr scripts de instalación (binarios nativos).
allowBuilds:
  # Negados a propósito (fase 6): el preinstall de Baileys solo revisa la versión de Node y el
  # postinstall de protobufjs también; ninguno hace falta para correr.
  '@whiskeysockets/baileys': false
  better-sqlite3: true
  esbuild: true
  protobufjs: false
