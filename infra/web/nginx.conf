# Local backoffice (docker-compose.stack.yml). Same headers as apps/web/vercel.json.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # All backoffice traffic goes to the API; the session cookie is same-origin.
  location /bo/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 5m;
  }

  # This nginx image doesn't know `.mjs` (it would serve application/octet-stream) and browsers
  # won't load a module with that type; the PDF viewer (pdf.js) starts its worker as .mjs.
  location ~* \.mjs$ {
    default_type text/javascript;
    expires max;
  }

  location /assets/ {
    try_files $uri =404;
    expires max;
  }

  location / {
    try_files $uri /index.html;
  }
}
