# Backoffice local (docker-compose.stack.yml). Mismas cabeceras que apps/web/vercel.json.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Todo lo del backoffice va a la API: la cookie de sesión es del mismo origen.
  location /bo/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 5m;
  }

  # El nginx de esta imagen no conoce `.mjs` (lo serviría como application/octet-stream) y el navegador
  # no carga un módulo con ese tipo: el visor de PDF (pdf.js) arranca su worker como .mjs.
  location ~* \.mjs$ {
    default_type text/javascript;
    expires max;
  }

  location /assets/ {
    try_files $uri =404;
    expires max;
  }

  location / {
    try_files $uri /index.html;
  }
}
