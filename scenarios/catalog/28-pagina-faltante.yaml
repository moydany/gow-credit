# The document prints "Pág 1/3" and "Pág 3/3": page 2 is missing. Extraction sets the
# `pages_missing` flag and, without that page, the period doesn't reconcile (`reconciled: false`).
# With the base template the engine doesn't send the case to human review for the mismatch: it
# asks for the full PDF (`missing_pages`). If it still didn't reconcile with the full document,
# the `integrity` gate would fail again.
id: pagina-faltante
catalog: 28
title: PDF al que le falta una página, se pide el documento completo
modes: [unit]
as_of: 2026-10-05
tenant: { name: Fintech Demo, policy: base }
suppliers:
  - id: sup-1
    name: Distribuidora Luna SA de CV
    rfc: DLU150304AB1
    statements:
      - start: 2026-09-01
        opening_balance: 80000
        reconciled: false
        flags: [pages_missing]
        monthly:
          - { kind: customer_payment, amount: 150000, count: 2, counterparty: Cadena Norte SA de CV }
          - { kind: customer_payment, amount: 150000, count: 6 }
          - { kind: supplier_payment, amount: 120000, count: 4 }
    request: { amount: 100000, buyer: Cadena Norte SA de CV }
expect:
  status: needs_clarification
  clarification_topics: [missing_pages]
  reasons_include: [gate_pages_complete, gate_integrity_deferred]
  next_steps_include: [document_pages_missing]
  features: { document_pages_missing: true, integrity_ok: false }
