# CI del worksample (docs/00-brief.md §4, fase 8). Nada aquí usa llaves de modelos ni datos
# reales: los modelos salen de cachés versionadas (inyección, clasificador) y lo que necesita
# data/ corre en eval-extraction.yml, que restaura un paquete cifrado de almacenamiento privado.
# Las acciones van fijadas por SHA; el comentario dice la versión.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test y escenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (versión de packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres 17 con los roles de docs/05 §2
        run: docker compose up -d --wait
      - run: pnpm db:migrate
      - run: pnpm typecheck
      # Los avisos de tamaño y complejidad no pueden crecer (--max-warnings en `lint`); bájalo al arreglar.
      - run: pnpm lint
      - name: Duplicación entre archivos (jscpd)
        run: pnpm dup
      # Con Postgres arriba, `pnpm test` incluye RLS y aislamiento entre tenants.
      - run: pnpm test
      - name: Escenarios en modo unitario
        run: pnpm scenario run --all
      - name: Escenarios en modo full (los que necesitan data/ se saltan)
        run: pnpm scenario run --all --mode full

  evals-keyless:
    name: evals sin llaves (inyección y clasificador)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PDFs adversarios sintéticos y respuestas versionadas en evals/fixtures: sin llaves, sin costo.
      - name: Eval de inyección (100 % o falla)
        working-directory: evals
        run: pnpm exec evalite run injection.eval.ts --hideTable
      - name: Eval del clasificador sobre los adversarios
        working-directory: evals
        run: pnpm exec evalite run classifier.eval.ts --hideTable

  web:
    name: build del backoffice
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @gow/web build

  images:
    name: imágenes de api y worker (sin publicar)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: false
          tags: gow-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
